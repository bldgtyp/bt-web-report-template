name: CI

# Per-project CI delegates everything to the reusable workflow in the
# template repo. Editing the build pipeline happens in ONE place:
# bldgtyp/bt-web-report-template/.github/workflows/_renderer-build.yml
#
# The @main pin means template fixes (schema sibling-checkout, wait-for-publish,
# Cloudflare deploy retry, etc.) propagate to this project's next CI run
# automatically. If a template change ever breaks this project, pin to a
# specific commit SHA or tag instead of @main while the issue is sorted out.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    uses: bldgtyp/bt-web-report-template/.github/workflows/_renderer-build.yml@main
    with:
      project-repo: ${{ github.repository }}
      project-ref: ${{ github.ref }}
      renderer-ref: main
      schemas-ref: main
      run-deploy: false
    secrets:
      BLDGTYP_PACKAGES_TOKEN: ${{ secrets.BLDGTYP_PACKAGES_TOKEN }}
