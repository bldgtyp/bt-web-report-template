name: Deploy to Cloudflare Pages

# Per-project deploy delegates to the reusable workflow in the template repo.
# All build/validate/retry/deploy logic lives in ONE place:
# bldgtyp/bt-web-report-template/.github/workflows/_renderer-build.yml

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    uses: bldgtyp/bt-web-report-template/.github/workflows/_renderer-build.yml@main
    with:
      project-repo: ${{ github.repository }}
      project-ref: ${{ github.ref }}
      renderer-ref: main
      schemas-ref: main
      run-deploy: true
      cloudflare-pages-project: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
    secrets:
      BLDGTYP_PACKAGES_TOKEN: ${{ secrets.BLDGTYP_PACKAGES_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
