name: Deploy to Cloudflare Pages

# Project-local deploy for vendored bt-web-report projects.
#
# Same build steps as ci.yml, plus a separate deploy job that publishes the
# built dist/ to the project's Cloudflare Pages site. The Pages project and
# custom domain are bound ONCE at `btwr new` bootstrap (or via
# `btwr bootstrap-cloudflare`), not on every deploy.

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      dist-artifact: ${{ steps.dist-artifact.outputs.name }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify deploy secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not configured for this repo."
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID secret is not configured for this repo."
            missing=1
          fi
          exit "$missing"

      - name: Install dependencies (with retry)
        run: scripts/retry.sh --label='pnpm install' --max-attempts=4 --initial-delay=10 -- pnpm install --ignore-scripts --frozen-lockfile

      - name: Validate project metadata
        run: pnpm validate

      - name: Type-check
        run: pnpm check

      - name: Tina editor audit
        run: pnpm check:editor

      - name: Build
        run: pnpm build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium (full, on cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: scripts/retry.sh --label='playwright install' --max-attempts=4 --initial-delay=10 -- pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit path)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: scripts/retry.sh --label='playwright install-deps' --max-attempts=4 --initial-delay=10 -- pnpm exec playwright install-deps chromium

      - name: Build PDF
        run: node scripts/build-pdf.mjs

      - name: Tests
        run: pnpm test:integration

      - name: Resolve dist artifact name
        id: dist-artifact
        run: echo "name=dist-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Upload built dist for deploy job
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dist-artifact.outputs.name }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout project (for scripts/retry.sh + project.yaml)
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Download built dist
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.dist-artifact }}
          path: dist

      - name: Resolve Cloudflare project name
        id: cf
        run: |
          # The repo-level CLOUDFLARE_PAGES_PROJECT var is set once at
          # `btwr new` bootstrap. Falls back to the repo name if unset.
          PROJECT_NAME="${{ vars.CLOUDFLARE_PAGES_PROJECT }}"
          if [ -z "$PROJECT_NAME" ]; then
            PROJECT_NAME="${GITHUB_REPOSITORY#*/}"
          fi
          echo "project=$PROJECT_NAME" >> "$GITHUB_OUTPUT"
          echo "Cloudflare Pages project: $PROJECT_NAME"

      - name: Deploy dist to Cloudflare Pages (with retry on transient 5xx)
        run: |
          scripts/retry.sh \
            --label='wrangler pages deploy' \
            --max-attempts=6 \
            --initial-delay=15 \
            --max-delay=180 \
            -- \
            pnpm dlx wrangler pages deploy dist --project-name "${{ steps.cf.outputs.project }}"
