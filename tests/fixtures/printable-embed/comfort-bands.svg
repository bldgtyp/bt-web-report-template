<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Illustrative indoor comfort bands</title>
  <desc id="description">Three horizontal temperature bands shown as a static print fixture.</desc>
  <rect width="1200" height="675" fill="#f7f4ed"/>
  <text x="80" y="100" fill="#17323a" font-family="sans-serif" font-size="42">Indoor comfort bands</text>
  <rect x="80" y="170" width="1040" height="110" rx="12" fill="#c7e2ea"/>
  <rect x="80" y="300" width="1040" height="110" rx="12" fill="#8fc8d8"/>
  <rect x="80" y="430" width="1040" height="110" rx="12" fill="#3e93ae"/>
  <text x="110" y="240" fill="#17323a" font-family="sans-serif" font-size="30">Cool</text>
  <text x="110" y="370" fill="#17323a" font-family="sans-serif" font-size="30">Comfortable</text>
  <text x="110" y="500" fill="#ffffff" font-family="sans-serif" font-size="30">Warm</text>
</svg>
