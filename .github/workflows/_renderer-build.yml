name: Renderer build (reusable)

# Single source of truth for the bt-web-report renderer build pipeline.
# Called by the template's own ci.yml / deploy.yml AND by every per-project
# repo's CI. Editing the build flow happens here, once.
#
# Cascade-resistance principles (every change here is in service of one of these):
#
# 1. Schema validation reads from a sibling checkout of bt-web-report-schemas,
#    NOT from the GitHub Packages tarball. New schema fields land on `main`
#    immediately; consumers never wait for a publish to validate.
#
# 2. The schemas npm package is still needed for `pnpm install` (Tina helpers).
#    If the renderer's pinned version isn't on GitHub Packages yet, we POLL
#    until it lands instead of failing. Combined with the schemas repo's
#    auto-publish-on-version-bump workflow, CI can never race ahead of the publish.
#
# 3. Every step that touches an external network or API (Cloudflare, the npm
#    registry, GitHub Packages, git checkouts) is wrapped in retry-with-backoff
#    via scripts/retry.sh. Cloudflare returning a 5xx on asset upload (it does,
#    regularly) no longer fails the whole pipeline.
#
# 4. Build artifacts are uploaded after the build job and downloaded by a
#    separate deploy job. A failed deploy can be re-run from the GitHub UI
#    without rebuilding — saving time and isolating "did the build actually
#    work" from "is Cloudflare currently up".
#
# 5. Cloudflare deploy is gated by an input so one workflow file handles both
#    CI (build-only) and deploy use cases without duplication.

on:
  workflow_call:
    inputs:
      project-repo:
        description: "owner/repo holding the project content (project.yaml + content/)."
        type: string
        required: true
      project-ref:
        description: "Ref of project-repo to check out. Empty means the default branch."
        type: string
        default: ""
      renderer-ref:
        description: "Ref of bldgtyp/bt-web-report-template to check out."
        type: string
        default: "main"
      schemas-ref:
        description: "Ref of bldgtyp/bt-web-report-schemas to check out for the validate step."
        type: string
        default: "main"
      run-deploy:
        description: "Deploy to Cloudflare Pages after a successful build."
        type: boolean
        default: false
      manage-custom-domain:
        description: "Attach/update the project.yaml production URL as a Cloudflare Pages custom domain."
        type: boolean
        default: true
      cloudflare-pages-project:
        description: "Cloudflare Pages project name. Defaults to the project repo name."
        type: string
        default: ""
      package-publish-timeout-seconds:
        description: "Max seconds to wait for the pinned @bldgtyp/web-report-schemas version to appear on the public npm registry. Default 1800 (30 min) — CI waits, not fails, while the auto-publish flow catches up."
        type: number
        default: 1800
    secrets:
      CLOUDFLARE_API_TOKEN:
        description: "Required when run-deploy=true."
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        description: "Required when run-deploy=true."
        required: false
      CLOUDFLARE_ACCESS_OTP_IDP_ID:
        description: "Required only when project.yaml sets publishing.access.mode=cloudflare_access_otp."
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ACCESS_OTP_IDP_ID: ${{ secrets.CLOUDFLARE_ACCESS_OTP_IDP_ID }}
      # MUST be at job level (not step level). pnpm scripts chain: `pnpm build`
      # internally invokes `pnpm validate` again, and any step-scoped env var
      # would NOT propagate into the inner invocation. Job-level env ensures
      # every pnpm/node command in this job reads from the schemas
      # source-of-truth, NEVER from the stale registry tarball.
      BTWR_PROJECT_SCHEMA_JSON: ${{ github.workspace }}/schemas-src/schemas/project.schema.json
    outputs:
      dist-artifact: ${{ steps.dist-artifact.outputs.name }}
      project-name: ${{ steps.cf.outputs.project }}
    steps:
      - name: Checkout project content
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.project-repo }}
          ref: ${{ inputs.project-ref }}
          path: project

      - name: Checkout shared renderer
        uses: actions/checkout@v6
        with:
          repository: bldgtyp/bt-web-report-template
          ref: ${{ inputs.renderer-ref }}
          path: renderer

      - name: Checkout schemas (source of truth for validate)
        uses: actions/checkout@v6
        with:
          repository: bldgtyp/bt-web-report-schemas
          ref: ${{ inputs.schemas-ref }}
          path: schemas-src

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify required secrets
        if: ${{ inputs.run-deploy }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN required when run-deploy=true."
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID required when run-deploy=true."
            missing=1
          fi
          exit "$missing"

      - name: Wait for pinned schemas package to publish
        working-directory: renderer
        run: |
          PINNED=$(node -e 'const p=require("./package.json");const v=p.dependencies["@bldgtyp/web-report-schemas"]; if(!v){process.exit(1)}; console.log(v.replace(/^[\^~]/,""))')
          if [ -z "$PINNED" ]; then
            echo "::error::renderer package.json does not declare @bldgtyp/web-report-schemas"
            exit 1
          fi
          echo "Renderer pins @bldgtyp/web-report-schemas@$PINNED"
          node scripts/wait-for-package-version.mjs @bldgtyp/web-report-schemas "$PINNED" --timeout-seconds=${{ inputs.package-publish-timeout-seconds }}

      - name: Install renderer dependencies (with retry)
        working-directory: renderer
        run: scripts/retry.sh --label='pnpm install' --max-attempts=4 --initial-delay=10 -- pnpm install --ignore-scripts --no-frozen-lockfile

      - name: Lint workflow invariants (catches env-scope and retry-coverage regressions)
        working-directory: renderer
        run: node scripts/check-workflow-invariants.mjs

      - name: Prepare content-only runtime
        run: |
          mkdir runtime
          for item in astro.config.mjs package.json pnpm-lock.yaml playwright playwright.config.ts scripts tests tsconfig.json vitest.config.ts; do
            if [ -e "renderer/$item" ]; then
              ln -s "../renderer/$item" "runtime/$item"
            fi
          done
          # Copy source directories so relative MDX imports resolve from
          # runtime/content, not renderer/content through the symlink target.
          cp -a renderer/src runtime/src
          cp -a renderer/tina runtime/tina
          ln -s ../renderer/node_modules runtime/node_modules
          for item in project.yaml content data public; do
            cp -a "project/$item" "runtime/$item"
          done

      - name: Validate project metadata (against schemas source of truth)
        working-directory: runtime
        run: pnpm validate

      - name: Preflight Cloudflare Access configuration
        if: ${{ inputs.run-deploy && inputs.manage-custom-domain }}
        run: node renderer/scripts/setup-cloudflare-pages.mjs --project-yaml project/project.yaml --preflight-access

      - name: Type-check
        working-directory: runtime
        run: pnpm check

      - name: Tina editor audit
        working-directory: runtime
        run: pnpm check:editor

      - name: Build
        working-directory: runtime
        run: pnpm build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('renderer/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium (full, on cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: runtime
        run: ../renderer/scripts/retry.sh --label='playwright install' --max-attempts=4 --initial-delay=10 -- pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit path)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: runtime
        run: ../renderer/scripts/retry.sh --label='playwright install-deps' --max-attempts=4 --initial-delay=10 -- pnpm exec playwright install-deps chromium

      - name: Build PDF
        working-directory: runtime
        # Run the post-build script directly (not `pnpm build:pdf`) so we don't
        # re-execute validate+build inside the same job. dist/report.pdf rides
        # the same artifact upload + Cloudflare deploy as dist/index.html.
        run: node scripts/build-pdf.mjs

      - name: Tests
        working-directory: runtime
        # Per-project CI only runs the PDF integration assertion. Renderer
        # unit tests (data, markdown, resolve-var, var-keys, assembly-*) depend
        # on the workspace layout (test-files/ fixtures, sibling schemas repo)
        # and don't belong in per-project CI. They run via `pnpm test:unit`
        # locally; once they're decoupled from workspace paths, add a separate
        # unit-test job to the template repo's ci.yml.
        run: pnpm test:integration

      - name: Test printable embed fixture
        if: ${{ inputs.project-repo == github.repository }}
        working-directory: renderer
        run: pnpm test:printable-embed

      - name: Resolve Cloudflare project name
        id: cf
        if: ${{ inputs.run-deploy }}
        run: |
          PROJECT_NAME="${{ inputs.cloudflare-pages-project }}"
          if [ -z "$PROJECT_NAME" ]; then
            PROJECT_NAME="${GITHUB_REPOSITORY#*/}"
          fi
          echo "project=$PROJECT_NAME" >> "$GITHUB_OUTPUT"
          echo "Cloudflare Pages project: $PROJECT_NAME"

      - name: Ensure Cloudflare Pages project and domain (with retry)
        if: ${{ inputs.run-deploy && inputs.manage-custom-domain }}
        run: |
          renderer/scripts/retry.sh \
            --label='setup-cloudflare-pages' \
            --max-attempts=5 \
            --initial-delay=10 \
            --max-delay=120 \
            -- \
            node renderer/scripts/setup-cloudflare-pages.mjs --project-yaml project/project.yaml --project-name "${{ steps.cf.outputs.project }}"

      - name: Resolve dist artifact name
        id: dist-artifact
        if: ${{ inputs.run-deploy }}
        run: echo "name=runtime-dist-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Upload built dist for deploy job
        if: ${{ inputs.run-deploy }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dist-artifact.outputs.name }}
          path: runtime/dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: ${{ inputs.run-deploy }}
    needs: build
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout renderer (for retry.sh)
        uses: actions/checkout@v6
        with:
          repository: bldgtyp/bt-web-report-template
          ref: ${{ inputs.renderer-ref }}
          path: renderer

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Download built dist
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.dist-artifact }}
          path: dist

      - name: Deploy dist to Cloudflare Pages (with retry on transient 5xx)
        run: |
          renderer/scripts/retry.sh \
            --label='wrangler pages deploy' \
            --max-attempts=6 \
            --initial-delay=15 \
            --max-delay=180 \
            -- \
            pnpm dlx wrangler pages deploy dist --project-name "${{ needs.build.outputs.project-name }}"
