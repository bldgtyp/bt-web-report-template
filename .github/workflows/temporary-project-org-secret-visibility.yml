name: Temporary project org secret visibility

on:
  workflow_dispatch:

jobs:
  widen:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
      BLDGTYP_PACKAGES_TOKEN_VALUE: ${{ secrets.BLDGTYP_PACKAGES_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID_VALUE: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN_VALUE: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Update bldgtyp-projects org secrets
        run: |
          set -euo pipefail
          printf '%s' "$BLDGTYP_PACKAGES_TOKEN_VALUE" | gh secret set BLDGTYP_PACKAGES_TOKEN --org bldgtyp-projects --visibility all
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID_VALUE" | gh secret set CLOUDFLARE_ACCOUNT_ID --org bldgtyp-projects --visibility all
          printf '%s' "$CLOUDFLARE_API_TOKEN_VALUE" | gh secret set CLOUDFLARE_API_TOKEN --org bldgtyp-projects --visibility all
