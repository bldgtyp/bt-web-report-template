name: CI

# Template repo's own CI runs the shared renderer build against the seed
# project content that lives in this repo. Everything else (checkout strategy,
# schemas source-of-truth, dependency install, validate/check/build steps)
# is defined once in _renderer-build.yml and reused by every per-project
# repo's CI as well.
#
# Schemas comes from the public npm registry; no auth secret required.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    uses: ./.github/workflows/_renderer-build.yml
    with:
      project-repo: ${{ github.repository }}
      project-ref: ${{ github.ref }}
      renderer-ref: ${{ github.sha }}
      schemas-ref: main
      run-deploy: false
