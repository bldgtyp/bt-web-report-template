name: Deploy to Cloudflare Pages

# Template repo's own deploy: builds the seed content and deploys it as a
# preview/demo Pages project. Shares all build logic with CI via the
# reusable _renderer-build.yml; the only delta is run-deploy=true.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    uses: ./.github/workflows/_renderer-build.yml
    with:
      project-repo: ${{ github.repository }}
      project-ref: ${{ github.ref }}
      renderer-ref: ${{ github.sha }}
      schemas-ref: main
      run-deploy: true
      manage-custom-domain: false
      cloudflare-pages-project: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ACCESS_OTP_IDP_ID: ${{ secrets.CLOUDFLARE_ACCESS_OTP_IDP_ID }}
